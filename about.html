<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>about — a-usernameidk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1720;
    --panel:#16212C;
    --line:#26384A;
    --text:#E4ECF1;
    --dim:#7C93A6;
    --accent:#FFB454;
    --accent-dim:#C98A3E;
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }
  body{
    margin:0;
    background:
      linear-gradient(var(--bg), var(--bg)),
      repeating-linear-gradient(0deg, var(--line) 0px, var(--line) 1px, transparent 1px, transparent 48px),
      repeating-linear-gradient(90deg, var(--line) 0px, var(--line) 1px, transparent 1px, transparent 48px);
    background-attachment:fixed;
    color:var(--text);
    font-family:'Inter', sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; }
  ::selection{ background:var(--accent); color:#10151C; }

  .wrap{ max-width:680px; margin:0 auto; padding:0 28px; }

  header.top{ padding:64px 0 40px; }

  .tag{
    font-family:'Space Mono', monospace;
    font-size:12.5px;
    color:var(--dim);
    margin:0 0 18px;
  }
  .tag .dot{
    display:inline-block; width:6px; height:6px; border-radius:50%;
    background:var(--accent); margin-right:9px; box-shadow:0 0 8px var(--accent);
  }

  nav.jump{
    display:flex;
    gap:22px;
    font-family:'Space Mono', monospace;
    font-size:13px;
    margin-bottom:34px;
  }
  nav.jump a{
    text-decoration:none;
    border-bottom:1px solid var(--line);
    padding-bottom:2px;
    transition:border-color .15s ease, color .15s ease;
  }
  nav.jump a:hover{ border-color:var(--accent); color:var(--accent); }
  nav.jump a.current{ color:var(--accent); border-color:var(--accent-dim); }

  h1{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:clamp(28px, 5vw, 38px);
    margin:0 0 8px;
  }
  h1 span{ color:var(--accent); }

  .subtitle{ color:var(--dim); font-size:15px; margin:0 0 8px; }

  section{ padding:28px 0; border-bottom:1px solid var(--line); }
  section:last-of-type{ border-bottom:none; }

  .wip{ padding:36px 0 60px; border-bottom:none; }
  .wip-box{
    position:relative;
    padding:56px 40px;
    background:var(--panel);
    border:1px solid var(--line);
    text-align:center;
  }
  .wip-box::before, .wip-box::after,
  .wip-box .corner-tr, .wip-box .corner-br{
    content:"";
    position:absolute;
    width:16px; height:16px;
    border:1.5px solid var(--accent-dim);
  }
  .wip-box::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .wip-box::after{ bottom:-1px; left:-1px; border-right:none; border-top:none; }
  .wip-box .corner-tr{ top:-1px; right:-1px; border-left:none; border-bottom:none; }
  .wip-box .corner-br{ bottom:-1px; right:-1px; border-left:none; border-top:none; }

  .wip-code{
    font-family:'Space Mono', monospace;
    font-size:14px;
    color:var(--accent);
    margin:0 0 10px;
  }
  .wip-msg{
    color:var(--dim);
    font-size:14.5px;
    margin:0;
  }

  footer{
    padding:36px 0 64px;
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--dim);
  }
  footer a{ color:var(--accent-dim); text-decoration:none; border-bottom:1px solid var(--line); }
  footer a:hover{ color:var(--accent); border-color:var(--accent); }
</style>
</head>
<body>

  <div class="wrap">

    <header class="top">
      <p class="tag"><span class="dot"></span>github.com/a-usernameidk</p>
      <nav class="jump">
        <a href="index.html">Projects</a>
        <a href="about.html" class="current">About</a>
        <a href="prints.html">Prints</a>
        <a href="https://github.com/a-usernameidk" target="_blank" rel="noopener">GitHub profile ↗</a>
      </nav>
      <h1>About <span>/ now</span></h1>
      <p class="subtitle">Who I am, and what I'm actually up to right now.</p>
    </header>

    <section class="wip">
      <div class="wip-box">
        <span class="corner-tr"></span><span class="corner-br"></span>
        <p class="wip-msg">I do Python projects where I make games and things, just randomly.</p>
      </div>
    </section>

  </div>

  <footer>
    <div class="wrap" style="padding:0;">
      <a href="index.html">← back to projects</a>
    </div>
  </footer>

</body>
</html>
